version: "3.8"

services:
  backend:
    build: ./backend
    container_name: clouddeployx-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production

  frontend:
    build: ./frontend
    container_name: clouddeployx-frontend
    ports:
      - "80:80"
    depends_on:
      - backend